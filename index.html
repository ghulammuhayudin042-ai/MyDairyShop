body{font:14px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,var(--l),#fff 60%);color:#1e293b}

nav::before{content:"🥛 Dairy POS";display:block;color:#fff;font-size:20px;font-weight:800;letter-spacing:.3px;padding:6px 8px 16px;border-bottom:1px solid #fff2;margin-bottom:10px}
nav a{border-left:0;border-radius:12px;padding:10px 12px;margin:4px 0;font-weight:500;color:#cbd5e1;background:transparent;transition:.18s;display:flex;align-items:center;gap:10px}

nav a:nth-child(1)::before{content:"📊"}nav a:nth-child(2)::before{content:"🛒"}nav a:nth-child(3)::before{content:"📦"}nav a:nth-child(4)::before{content:"🚚"}nav a:nth-child(5)::before{content:"👥"}nav a:nth-child(6)::before{content:"🏭"}nav a:nth-child(7)::before{content:"🧾"}nav a:nth-child(8)::before{content:"🗄️"}nav a:nth-child(9)::before{content:"💰"}nav a:nth-child(10)::before{content:"📈"}nav a:nth-child(11)::before{content:"⚙️"}
nav a:hover{background:#ffffff1a;color:#fff;transform:translateX(3px)}nav a.on{background:linear-gradient(90deg,var(--a),#ffffff22);color:#fff;font-weight:700;box-shadow:0 4px 14px #0004}
main{margin:14px;padding:22px 26px;border:0;border-radius:22px;background:#fff;box-shadow:0 10px 40px #0f172a14;border-top:0;position:relative}

input,select,textarea{border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 12px;background:#f8fafc;transition:.15s;outline:0}

button{border-radius:10px;padding:9px 16px;font-weight:600;background:var(--b);box-shadow:0 3px 10px color-mix(in srgb,var(--b) 35%,transparent);transition:.15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:none}
button.s{background:#fff;box-shadow:none;border:1.5px solid color-mix(in srgb,var(--b) 40%,#fff);color:var(--b);padding:6px 12px}button.s:hover:not(:disabled){background:var(--l)}
.row{gap:8px;margin:10px 0}
table{border-collapse:separate;border-spacing:0;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#fff}
th{background:var(--l);color:var(--b);font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:11px 12px;cursor:pointer;border-bottom:1px solid #e2e8f0}

.g{gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

.c:hover{transform:translateY(-3px)}.c b{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.5px}

.pos>div{background:#f8fafc;border-radius:16px;padding:14px}
#tot{font-size:24px;font-weight:800;color:var(--b)}
#ok{font-size:16px;padding:12px 22px;background:linear-gradient(135deg,#16a34a,#22c55e)}

main>.row:first-of-type input[type=password]{min-width:200px}

<nav id=nav></nav><main id=m></main><div id=t></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),F=n=>(+n||0).toFixed(2),T=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);let ST={},cart=[],key=null;
let ME={},CV=[];async function api(p,b){const r=await fetch('/api/'+p,b?{method:'POST',body:JSON.stringify(b)}:{});const j=await r.json();if(j.error){if(j.login)showLogin();throw new Error(j.error)}return j}
function showLogin(){M.innerHTML='<div style="max-width:380px;margin:8vh auto;text-align:center"><div style="font-size:56px">🥛</div><h2>Dairy Shop POS</h2><p style="color:#64748b">Sign in to continue</p></div><div class=row style="max-width:520px;margin:auto;justify-content:center"><input id=lu placeholder=Username><input id=lp type=password placeholder=Password onkeydown="if(event.key==\'Enter\')lg2()"><button onclick=lg2()>Login</button></div>'}
async function lg2(){await act('login',{username:V('lu'),password:V('lp')},'Welcome',async()=>{ME=await api('me');go('Dashboard')})}
function toast(x,bad){const t=$('#t');t.textContent=x;t.style.background=bad?'#b91c1c':'#15803d';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function act(p,b,ok,then){try{const r=await api(p,b);toast(ok||'Saved');if(then)await then(r);return r}catch(e){toast(e.message,1)}}
const V=id=>$('#'+id).value,pinp=()=>ME.role=='admin'?'':prompt('Supervisor PIN (or ask an admin)')||'';
const pages={Dashboard:dash,POS:pos,Products:prods,Purchases:purch,Customers:()=>people('customer'),Suppliers:()=>people('supplier'),Sales:sales,Inventory:inv,'Cash & Expenses':cashp,Reports:reps,Settings:sett};
$('#nav').innerHTML=Object.keys(pages).map(k=>`<a onclick="go('${k}')">${k}</a>`).join('');
const PAL={Dashboard:['#2563eb','#dbeafe'],POS:['#16a34a','#dcfce7'],Products:['#ea580c','#ffedd5'],Purchases:['#9333ea','#f3e8ff'],Customers:['#0d9488','#ccfbf1'],Suppliers:['#db2777','#fce7f3'],Sales:['#dc2626','#fee2e2'],Inventory:['#ca8a04','#fef9c3'],'Cash & Expenses':['#0891b2','#cffafe'],Reports:['#4f46e5','#e0e7ff'],Settings:['#475569','#e2e8f0']};
async function go(k){const p=PAL[k]||PAL.Dashboard;document.documentElement.style.setProperty('--b',p[0]);document.documentElement.style.setProperty('--l',p[1]);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.textContent==k));ST=await api('settings');M.innerHTML='<h2>'+k+'</h2><div id=b>Loading...</div>';try{await pages[k]()}catch(e){$('#b').innerHTML='<p class=low>'+e.message+'</p>'}}
const B=h=>$('#b').innerHTML=h,opt=(a,f=x=>x.name)=>a.map(x=>`<option value=${x.id}>${f(x)}</option>`).join('');
async function dash(){const d=await api(`dashboard?from=${window.df||T}&to=${window.dt||T}`),ex=await api('expiry');const k=[['Gross sales',d.gross],['Returns',d.returns],['Net sales',d.net_sales],['Purchases',d.purchases],['Expenses',d.expenses],['Cash received',d.cash_received],['Credit sales',d.credit_sales],['Collections',d.collections],['Supplier payments',d.supplier_payments],['Est. gross profit',d.gross_profit],['Est. net profit',d.net_profit],['Products',d.products],['Low stock',d.low.length],['Out of stock',d.out.length],['Customer due',d.cust_due],['Supplier due',d.sup_due],['Cash balance',d.cash_balance]];
B(`<div class=row><button onclick="go('POS')">New Sale</button><button onclick="go('Products')">Add Product</button><button onclick="go('Purchases')">Record Purchase</button><button onclick="go('Customers')">Add Customer / Receive Payment</button><button onclick="go('Cash & Expenses')">Add Expense</button><button onclick="go('Reports')">Reports</button></div><div class=row>From <input type=date id=df value=${window.df||T}> To <input type=date id=dt value=${window.dt||T}><button class=s onclick="window.df=V('df');window.dt=V('dt');dash()">Apply</button><button class=s onclick="window.df=window.dt=null;dash()">Today</button></div><div class=g>${k.map(x=>`<div class=c>${x[0]}<b>${F(x[1])}</b></div>`).join('')}</div><h3>Low / out of stock</h3>${[...d.low,...d.out].map(x=>`<div class=low>${x.name}: ${x.stock} ${x.unit}</div>`).join('')||'None'}<h3>Expiry alerts (14 days)</h3>${ex.map(x=>`<div class=low>${x.name} ${x.status} ${x.expiry} (stock ${x.stock})</div>`).join('')||'None'}<h3>Top sellers today</h3>${d.top.map(x=>`<div>${x.name}: ${x.qty}</div>`).join('')||'No sales yet'}<h3>Recent transactions</h3><table>${d.recent.map(x=>`<tr><td>${x.ref||''}</td><td>${x.kind}</td><td>${x.party||'Walk-in'}</td><td>${F(x.total)}</td><td>${x.status}</td></tr>`).join('')}</table>`)}
async function pos(){const cs=await api('parties?kind=customer');CV=await api('conv');window.CATS=await api('categories');key=key||crypto.randomUUID();
B(`<div class=pos><div><select id=cf onchange=find()><option value="">All categories</option>${CATS.map(x=>`<option>${x.category}</option>`).join('')}</select><input id=q placeholder="Search / scan barcode + Enter" style="width:100%" autofocus><div class=pl id=pl></div></div><div><div class=row><select id=cu><option value=0>Walk-in</option>${opt(cs)}</select><button class=s onclick="newCust()">+ Customer</button></div><table id=ct></table><div class=row>Discount <input id=di value=0 size=6> Reason <input id=dr size=10></div><div class=row>Paid <input id=pd size=8 placeholder=full> <select id=me><option>cash</option><option>card</option><option>other</option></select> <input id=pd2 size=8 placeholder="split: other amt"> Notes <input id=nt size=10></div><h3 id=tot></h3><button id=ok onclick=done()>Complete Sale</button> <button class=s onclick="cart=[];key=null;pos()">Clear</button></div></div>`);
$('#q').oninput=find;$('#q').onkeydown=async e=>{if(e.key=='Enter'){const r=await api('products?q='+encodeURIComponent(V('q'))+'&cat='+encodeURIComponent(V('cf')));const x=r.find(p=>p.barcode==V('q'))||(r.length==1&&r[0]);if(x){add(x);$('#q').value='';find()}}};['di','pd'].forEach(i=>$('#'+i).oninput=draw);find();draw()}
async function find(){const r=await api('products?q='+encodeURIComponent(V('q'))+'&cat='+encodeURIComponent(V('cf')));window.PL=r;$('#pl').innerHTML=r.map((p,i)=>`<div onclick="add(PL[${i}])">${p.name} <b>${F(p.price)}/${p.unit}</b><br><small class=${p.stock<=p.min_stock?'low':''}>Stock ${p.stock} ${p.unit} · cost ${F(p.cost)}</small></div>`).join('')||'No products'}
function add(p){const x=cart.find(c=>c.p.id==p.id);x?x.qty++:cart.push({p,qty:1});draw()}
const fct=c=>c.unit&&c.unit!=c.p.unit?(CV.find(x=>x.base==c.p.unit&&x.alt==c.unit)||{factor:1}).factor:1,sub=()=>cart.reduce((s,c)=>s+Math.round(c.qty*fct(c)*c.p.price*100)/100,0),gt=()=>+((sub()-(+V('di')||0))*(1+(+ST.tax_pct||0)/100)).toFixed(2);
function draw(){if(!$('#ct'))return;$('#ct').innerHTML='<tr><th>Item<th>Qty<th>Amt<th></tr>'+cart.map((c,i)=>`<tr><td>${c.p.name}<td><input size=5 value=${c.qty} onchange="cart[${i}].qty=+this.value;draw()"> <select onchange="cart[${i}].unit=this.value;draw()">${[c.p.unit,...CV.filter(x=>x.base==c.p.unit).map(x=>x.alt)].map(u=>`<option ${(c.unit||c.p.unit)==u?'selected':''}>${u}</option>`).join('')}</select><td>${F(c.qty*fct(c)*c.p.price)}<td><button class=s onclick="cart.splice(${i},1);draw()">x</button></tr>`).join('');$('#tot').textContent='Total: '+ST.currency+' '+F(gt())+(+ST.tax_pct?' (incl. tax '+ST.tax_pct+'%)':'')}
async function done(){const t=gt(),b=$('#ok');b.disabled=true;const r=await act('sale',{key,party_id:+V('cu'),items:cart.map(c=>({product_id:c.p.id,qty:c.qty,unit:c.unit})),discount:+V('di'),reason:V('dr'),paid:V('pd')===''?t:+V('pd'),method:V('me'),note:V('nt'),payments:V('pd2')?[{method:'cash',amount:+V('pd')||0},{method:V('me')=='cash'?'other':V('me'),amount:+V('pd2')}]:undefined},'Sale saved',r=>{if(!window.open('/api/receipt?id='+r.id))toast('Pop-up blocked: allow pop-ups or use Sales > Reprint',1);cart=[];key=null;pos()});if(!r){b.disabled=false;if(/PIN/.test(document.getElementById('t').textContent)){}}}
async function newCust(){const n=prompt('Customer name');if(n){await act('parties',{kind:'customer',name:n,phone:prompt('Phone')||''});const s=V('q');const keep=cart;await pos();cart=keep;draw()}}
async function prods(){const p=await api('products?all=1&q='+(window.pq||''));B(`<div class=row><input id=pn placeholder=Name><input id=ps placeholder=SKU size=8><input id=pb placeholder=Barcode size=10><input id=pc placeholder=Category size=9><input id=pu placeholder="Unit (liter/kg/pcs)" size=10><input id=pdc placeholder="decimals" size=5 value=2><input id=pco placeholder=Cost size=6><input id=pp placeholder=Price size=6><input id=pm placeholder="Min stock" size=6><input id=po placeholder="Opening stock" size=7><input id=pbr placeholder=Brand size=8><input id=pnt placeholder=Notes size=10><input type=hidden id=pid><button onclick=savep()>Save</button></div><input placeholder=Search oninput="window.pq=this.value;window.pg=0;prods()" value="${window.pq||''}"><table><tr><th>Name<th>SKU/Barcode<th>Unit<th>Cost<th>Price<th>Stock<th>Status<th></tr>${p.slice((window.pg||0)*15,(window.pg||0)*15+15).map((x,i)=>`<tr><td>${x.name}<td>${x.sku||''} ${x.barcode||''}<td>${x.unit}<td>${F(x.cost)}<td>${F(x.price)}<td class=${x.stock<=x.min_stock?'low':''}>${x.stock}<td>${x.active?'Active':'Inactive'}<td><button class=s onclick='ed(${JSON.stringify(x)})'>Edit</button> <button class=s onclick='tg(${JSON.stringify(x)})'>${x.active?'Deactivate':'Activate'}</button></tr>`).join('')}</table><button class=s ${(window.pg||0)<=0?'disabled':''} onclick="pg--;prods()">Prev</button> Page ${(window.pg||0)+1} of ${Math.max(1,Math.ceil(p.length/15))} <button class=s ${((window.pg||0)+1)*15>=p.length?'disabled':''} onclick="pg++;prods()">Next</button>`)}
const pf={pn:'name',ps:'sku',pb:'barcode',pc:'category',pu:'unit',pdc:'decimals',pco:'cost',pp:'price',pm:'min_stock',pbr:'brand',pnt:'notes',pid:'id'};
function ed(x){for(const k in pf)$('#'+k).value=x[pf[k]]??''}
function tg(x){act('products',{...x,active:x.active?0:1},'Updated',prods)}
function savep(){const d={opening:V('po')};for(const k in pf)d[pf[k]]=V(k);act('products',d,'Product saved',prods)}
async function purch(){const[s,p,h]=await Promise.all([api('parties?kind=supplier'),api('products'),api('docs?kind=purchase&limit=15')]);window.PR=[];window.pk=crypto.randomUUID();
B(`<div class=row><select id=su>${opt(s)}</select><input id=sr placeholder="Supplier invoice ref"><input id=pdt type=date title="Purchase date (blank = today)"><select id=pr>${opt(p)}</select><input id=pq size=6 placeholder=Qty><input id=pcs size=6 placeholder="Unit cost"><input id=pex type=date title="Expiry (optional)"><button class=s onclick=addl()>Add line</button></div><table id=pt></table><div class=row>Discount <input id=pdi value=0 size=6> Paid <input id=ppd value=0 size=8> <select id=pme><option>cash</option><option>credit/other</option></select><button id=pbtn onclick=postp()>Confirm purchase</button></div><h3>Recent purchases</h3><table>${h.rows.map(x=>`<tr><td>${x.ref}<td>${x.ts}<td>${x.party}<td>${F(x.total)}<td>Paid ${F(x.paid)}<td>${x.status}<td>${x.status=='done'?`<button class=s onclick=pret(${x.id})>Return</button> <button class=s onclick=voidd(${x.id})>Void</button>`:''}</tr>`).join('')}</table>`);window.PP=p}
async function pret(id){const d=await api('doc?id='+id),items=[];for(const i of d.items){const q=prompt('Return qty of '+i.name+' (bought '+i.qty+', 0 = none)','0');if(+q>0)items.push({product_id:i.product_id,qty:+q})}if(!items.length)return;act('preturn',{doc_id:id,items,reason:prompt('Reason (damaged/expired...)'),refund:+prompt('Cash refunded by supplier now (rest reduces payable)','0')},'Purchase return posted',purch)}
function addl(){PR.push({product_id:+V('pr'),qty:+V('pq'),cost:+V('pcs'),expiry:V('pex')});$('#pt').innerHTML=PR.map(l=>`<tr><td>${PP.find(p=>p.id==l.product_id).name}<td>${l.qty}<td>${F(l.cost)}<td>${F(l.qty*l.cost)}</tr>`).join('')}
async function postp(){$('#pbtn').disabled=true;const r=await act('purchase',{key:pk,party_id:+V('su'),supplier_ref:V('sr'),date:V('pdt'),items:PR,discount:+V('pdi'),paid:+V('ppd'),method:V('pme')},'Purchase posted',purch);if(!r)$('#pbtn').disabled=false}
async function voidd(id){const reason=prompt('Void reason');if(reason)act('void',{doc_id:id,reason,pin:pinp()},'Voided',()=>go(document.querySelector('nav a.on').textContent))}
async function people(k){const l=await api('parties?kind='+k+'&q='+(window.cq||''));B(`<div class=row><input id=nm placeholder=Name><input id=ph placeholder=Phone><input id=ad placeholder=Address><input id=ob placeholder="Opening balance" size=8><button onclick="act('parties',{kind:'${k}',name:V('nm'),phone:V('ph'),address:V('ad'),opening:V('ob')},'Saved',()=>people('${k}'))">Add</button><input placeholder=Search oninput="window.cq=this.value;people('${k}')"></div><table><tr><th>Name<th>Phone<th>${k=='customer'?'Outstanding':'Payable'}<th></tr>${l.map(x=>`<tr><td>${x.name}<td>${x.phone||''}<td>${F(x.balance)}<td><button class=s onclick="payf(${x.id},'${k}')">${k=='customer'?'Receive payment':'Pay supplier'}</button> <button class=s onclick=ledg2(${x.id})>Ledger</button> <button class=s onclick=openi(${x.id})>Open invoices</button> <button class=s onclick=adjb(${x.id})>Adjust</button> <button class=s onclick='edp(${JSON.stringify(x)})'>Edit</button></tr>`).join('')}</table><div id=lg></div>`)}
function payf(id,k){const a=prompt('Amount');if(a)act('pay',{party_id:id,amount:a,note:prompt('Reference/notes')||'',method:'cash'},'Recorded',r=>{window.open('/api/payreceipt?ref='+r.ref);people(k)})}
function adjb(id){const a=prompt('Adjustment (+increase / -decrease)'),r=a&&prompt('Reason');if(r)act('adjust_balance',{party_id:id,amount:a,reason:r,pin:pinp()},'Adjusted',()=>go(document.querySelector('nav a.on').textContent))}
async function ledg(id){const l=await api('ledger?party_id='+id);$('#lg').innerHTML='<h3>Ledger</h3><table><tr><th>Date<th>Type<th>Ref<th>Amount<th>Balance</tr>'+l.map(x=>`<tr><td>${x.ts}<td>${x.type}<td>${x.ref}<td>${F(x.amount)}<td>${F(x.balance)}</tr>`).join('')+'</table>'}
let sp=0;async function sales(){const h=await api('docs?kind=sale&limit=15&offset='+sp);B(`<table><tr><th>Invoice<th>Date<th>Customer<th>Total<th>Paid<th>Status<th></tr>${h.rows.map(x=>`<tr><td>${x.ref}<td>${x.ts}<td>${x.party||'Walk-in'}<td>${F(x.total)}<td>${F(x.paid)}<td>${x.status}<td><button class=s onclick="window.open('/api/receipt?id=${x.id}')">Reprint</button>${x.status=='done'?` <button class=s onclick=retf(${x.id})>Return</button> <button class=s onclick=voidd(${x.id})>Void</button>`:''}</tr>`).join('')}</table><button class=s ${sp<=0?'disabled':''} onclick="sp-=15;sales()">Prev</button> ${h.total} sales <button class=s ${sp+15>=h.total?'disabled':''} onclick="sp+=15;sales()">Next</button>`)}
async function retf(id){const d=await api('doc?id='+id),items=[];for(const i of d.items){const q=prompt('Return qty for '+i.name+' (sold '+i.qty+', 0 = none)','0');if(+q>0)items.push({product_id:i.product_id,qty:+q,resalable:confirm('Resalable? OK=yes (restock), Cancel=damaged')})}if(!items.length)return;act('return',{doc_id:id,items,reason:prompt('Reason'),refund:+prompt('Cash refunded now (rest credited to customer)','0')},'Return processed',sales)}
async function inv(){const[p,s]=await Promise.all([api('products?all=1'),api('stock?from='+(window.sf||'')+'&to='+(window.st2||''))]);const v=p.reduce((a,x)=>a+x.stock*x.cost,0);B(`<div class=row><select id=wp>${opt(p)}</select><input id=wq size=6 placeholder="Wastage qty"><input id=wr placeholder=Reason><button onclick="act('wastage',{product_id:+V('wp'),qty:V('wq'),reason:V('wr')},'Wastage recorded',inv)">Record wastage</button></div><div class=row><select id=cp>${opt(p)}</select><input id=cc size=6 placeholder="Counted qty"><input id=cr placeholder=Reason><button class=s onclick="act('stockcount',{product_id:+V('cp'),counted:V('cc'),reason:V('cr'),pin:pinp()},'Adjusted',inv)">Stock count adjust</button></div><p>Stock valuation (qty x last purchase cost): <b>${F(v)}</b></p><div id=ch></div><table><tr><th>Product<th>Stock<th>Min<th>Value<th></tr>${p.map(x=>`<tr><td>${x.name}<td class=${x.stock<=x.min_stock?'low':''}>${x.stock} ${x.unit}${x.stock<0?' NEGATIVE STOCK':''}<td>${x.min_stock}<td>${F(x.stock*x.cost)}<td><button class=s onclick=chist(${x.id})>Cost history</button></tr>`).join('')}</table><h3>Stock movement ledger</h3><div class=row>From <input type=date id=sf value="${window.sf||''}"> To <input type=date id=st2 value="${window.st2||''}"><button class=s onclick="window.sf=V('sf');window.st2=V('st2');inv()">Filter</button><button class=s onclick=dsr()>Daily stock report</button></div><div id=sr></div><table><tr><th>Date<th>Product<th>Type<th>Ref<th>Qty<th>Balance<th>Note<th>User</tr>${s.map(x=>`<tr><td>${x.ts}<td>${x.name}<td>${x.type}<td>${x.ref}<td>${x.qty}<td>${x.balance}<td>${x.note||''}<td>${x.user||''}</tr>`).join('')}</table>`)}
async function cashp(){const[d,c]=await Promise.all([api('day'),api('cash')]);B(`<div class=c>${d.id?`Day open since ${d.opened}. Opening ${F(d.opening)} · Expected cash <b>${F(d.expected)}</b><div class=row><input id=cn placeholder="Counted cash"><input id=cnn placeholder=Notes><button onclick="act('day_close',{counted:V('cn'),note:V('cnn')},'Day closed',r=>alert('Expected '+r.expected+' Difference '+r.diff)||cashp())">Close day</button></div>`:`No open day <div class=row><input id=op placeholder="Opening cash"><button onclick="act('day_open',{opening:V('op')||0},'Day opened',cashp)">Open day</button></div>`}</div><h3>Expense</h3><div class=row><select id=ec><option>rent<option>electricity<option>transport<option>wages<option>packaging<option>repairs<option>other</select><input id=ea placeholder=Amount size=8><input id=en placeholder=Description><input id=er placeholder=Reference size=8><select id=es><option>cash drawer<option>bank<option>owner</select><button onclick="act('expense',{category:V('ec'),amount:V('ea'),note:V('en'),reference:V('er'),source:V('es')},'Expense saved',cashp)">Add expense</button></div><h3>Cash movements</h3><table><tr><th>Date<th>Type<th>Ref<th>Amount<th>Note</tr>${c.map(x=>`<tr><td>${x.ts}<td>${x.type} ${x.category||''}<td>${x.ref}<td>${F(x.amount)}<td>${x.note||''}</tr>`).join('')}</table>`)}
async function reps(){const f=window.rf||T,t=window.rt||T,r=await api(`report?from=${f}&to=${t}`);B(`<div class=row>From <input type=date id=rf value=${f}> To <input type=date id=rt value=${t}><button onclick="window.rf=V('rf');window.rt=V('rt');reps()">Apply</button><button class=s onclick=rng(0)>Today</button><button class=s onclick=rng(6)>Last 7 days</button><button class=s onclick=rng(29)>Last 30 days</button>${['sales','purchases','stock','expenses','customers','suppliers','products','ledger'].map(n=>`<a href="/api/csv?name=${n}&from=${f}&to=${t}"><button class=s>CSV ${n}</button></a>`).join('')}<button class=s onclick="print()">Print</button></div><div class=g>${['gross','discounts','returns','net_sales','purchases','expenses','wastage_cost','cogs','gross_profit','net_profit','credit_sales','collections','supplier_payments','cash_received'].map(k=>`<div class=c>${k.replace('_',' ')}<b>${F(r[k])}</b></div>`).join('')}</div><p><small>${r.note}</small></p><h3>Top products</h3><table><tr><th>Product<th>Qty<th>Revenue<th>Cost</tr>${r.top_products.map(x=>`<tr><td>${x.name}<td>${x.qty}<td>${F(x.revenue)}<td>${F(x.cost)}</tr>`).join('')}</table><h3>Expenses by category</h3>${r.by_category.map(x=>`<div>${x.category}: ${F(x.total)}</div>`).join('')}<h3>Purchases by supplier</h3><table>${r.by_supplier.map(x=>`<tr><td>${x.name}<td>${F(x.total)}<td>Paid ${F(x.paid)}</tr>`).join('')}</table><h3>Customer aging</h3><div id=ag></div><h3>Cash report</h3><div id=cr></div><h3>Slow-moving (lowest sales)</h3>${r.slow.map(x=>`<div>${x.name}: ${x.qty}</div>`).join('')}${r.negative.length?`<h3 class=low>Negative stock</h3>${r.negative.map(x=>`<div class=low>${x.name}: ${x.stock}</div>`).join('')}`:''}<h3>Audit trail</h3><div id=au></div>`);const a=await api('audit'),ag=await api('aging'),cr=await api(`cashreport?from=${f}&to=${t}`);$('#cr').innerHTML=`Received ${F(cr.received)} · Paid ${F(cr.paid)}<table><tr><th>Type<th>Net</tr>${cr.by_type.map(x=>`<tr><td>${x.type}<td>${F(x.amount)}</tr>`).join('')}</table><table><tr><th>Day opened<th>Opening<th>Expected<th>Counted<th>Difference</tr>${cr.days.map(x=>`<tr><td>${x.opened}<td>${F(x.opening)}<td>${x.expected==null?'open':F(x.expected)}<td>${x.counted==null?'':F(x.counted)}<td>${x.diff==null?'':F(x.diff)}</tr>`).join('')}</table>`;$('#ag').innerHTML='<table><tr><th>Customer<th>0-30<th>31-60<th>61+<th>Total</tr>'+ag.map(x=>`<tr><td>${x.name}<td>${F(x['0-30'])}<td>${F(x['31-60'])}<td>${F(x['61+'])}<td>${F(x.total)}</tr>`).join('')+'</table>';$('#au').innerHTML='<table>'+a.slice(0,20).map(x=>`<tr><td>${x.ts}<td>${x.action}<td>${x.detail}</tr>`).join('')+'</table>'}
async function sett(){B(`<div class=row>${['shop','phone','currency','prefix','footer','allow_negative','max_disc_pct','tax_pct','max_credit','receipt_mm','printer'].map(k=>`<label>${k} <input id=s_${k} value="${ST[k]||''}"></label>`).join('')}<button onclick="act('settings',{pin:pinp(),values:Object.fromEntries(['shop','phone','currency','prefix','footer','allow_negative','max_disc_pct','tax_pct','max_credit','receipt_mm','printer'].map(k=>[k,V('s_'+k)]))},'Saved')">Save settings (PIN)</button></div><h3>Backup</h3><button onclick="act('backup',{},'Backup created',r=>alert('Saved to '+r.file))">Create database backup</button><p>Restore: stop the app, copy a file from backups/ over dairy.db, start the app (see README).</p><div id=us></div>`);usr()}
async function usr(){const[cv,u]=await Promise.all([api('conv'),ME.role=='admin'?api('users'):[]]);$('#us').innerHTML=`<h3>Logo (receipt)</h3><input type=file accept=image/* onchange=logo(this)><h3>Unit conversions</h3><div class=row><input id=cb placeholder="Base unit (liter)" size=10><input id=ca placeholder="Sell unit (ml)" size=10><input id=cf placeholder="Factor (0.001)" size=8><button class=s onclick="act('conv',{base:V('cb'),alt:V('ca'),factor:V('cf')},'Saved',usr)">Save</button></div>${cv.map(x=>`<div>1 ${x.alt} = ${x.factor} ${x.base}</div>`).join('')}<h3>Users</h3>${ME.role=='admin'?`<div class=row><input id=un placeholder=Username><input id=up type=password placeholder="Password (min 6)"><select id=ur><option>cashier<option>admin</select><button class=s onclick="act('users',{username:V('un'),password:V('up'),role:V('ur')},'User saved',usr)">Add user</button></div>${u.map(x=>`<div>${x.username} (${x.role})</div>`).join('')}`:''}<h3>Change my password</h3><div class=row><input id=po1 type=password placeholder=Old><input id=pn1 type=password placeholder=New><button class=s onclick="act('password',{old:V('po1'),new:V('pn1')},'Password changed')">Change</button></div><button class=s onclick="api('logout',{}).then(()=>location.reload())">Log out (${ME.user})</button>`}
function rng(n){const d=new Date();d.setDate(d.getDate()-n);window.rf=d.toISOString().slice(0,10);window.rt=T;reps()}
function logo(i){const f=i.files[0];if(!f||f.size>200000)return toast('Image must be under 200 KB',1);const r=new FileReader();r.onload=()=>act('settings',{pin:pinp(),values:{logo:r.result}},'Logo saved');r.readAsDataURL(f)}
async function openi(id){const l=await api('open_items?party_id='+id);$('#lg').innerHTML='<h3>Open invoices (payments applied oldest first)</h3><table><tr><th>Ref<th>Date<th>Age (days)<th>Invoice<th>Still due</tr>'+l.map(x=>`<tr><td>${x.ref}<td>${x.ts}<td>${x.age}<td>${F(x.amount)}<td>${F(x.open)}</tr>`).join('')+'</table>'}
document.addEventListener('click',e=>{const th=e.target.closest('th');if(!th)return;const i=[...th.parentNode.children].indexOf(th),rows=[...th.closest('table').querySelectorAll('tr')].slice(1);if(!rows.length)return;const num=rows.every(r=>!isNaN(parseFloat(r.children[i]?.textContent))),d=th.d=-(th.d||-1);rows.sort((a,b)=>{const x=a.children[i]?.textContent||'',y=b.children[i]?.textContent||'';return d*(num?parseFloat(x)-parseFloat(y):x.localeCompare(y))});rows.forEach(r=>rows[0].parentNode.append(r))});
document.addEventListener('keydown',e=>{if(e.key=='F2'&&$('#q')){e.preventDefault();$('#q').focus()}if(e.key=='F9'&&$('#ok')){e.preventDefault();done()}if(e.key=='Escape'&&$('#q')){$('#q').value='';find();$('#q').focus()}});
async function ledg2(id,f,t){const l=await api(`ledger?party_id=${id}&from=${f||''}&to=${t||''}`);$('#lg').innerHTML=`<h3>Statement</h3><div class=row>From <input type=date id=lf value="${f||''}"> To <input type=date id=lt value="${t||''}"><button class=s onclick="ledg2(${id},V('lf'),V('lt'))">Filter</button><button class=s onclick=print()>Print</button></div><table><tr><th>Date<th>Type<th>Ref<th>Amount<th>Balance<th>Note</tr>${l.map(x=>`<tr><td>${x.ts}<td>${x.type}<td>${x.ref}<td>${F(x.amount)}<td>${F(x.balance)}<td>${x.note||''}</tr>`).join('')}</table>`}
function edp(x){const n=prompt('Name',x.name);if(!n)return;act('parties',{id:x.id,name:n,phone:prompt('Phone',x.phone||''),address:prompt('Address',x.address||''),notes:prompt('Notes',x.notes||''),active:confirm('Active? OK = active, Cancel = inactive')?1:0},'Saved',()=>go(document.querySelector('nav a.on').textContent))}
async function chist(id){const l=await api('costhistory?product_id='+id);$('#ch').innerHTML='<h3>Purchase cost history</h3><table><tr><th>Date<th>Ref<th>Supplier<th>Qty<th>Unit cost</tr>'+l.map(x=>`<tr><td>${x.ts}<td>${x.ref}<td>${x.supplier}<td>${x.qty}<td>${F(x.rate)}</tr>`).join('')+'</table>'}
async function dsr(){const l=await api(`stockreport?from=${V('sf')||T}&to=${V('st2')||V('sf')||T}`);$('#sr').innerHTML='<table><tr><th>Product<th>Opening<th>Received<th>Sold<th>Cust. returns<th>Supplier returns<th>Wastage<th>Adjust<th>Closing</tr>'+l.map(x=>`<tr><td>${x.name} (${x.unit})<td>${x.opening}<td>${x.received}<td>${x.sold}<td>${x.returned}<td>${x.supplier_returned}<td>${x.wastage}<td>${x.adjustments}<td class=${x.closing<0?'low':''}>${x.closing}</tr>`).join('')+'</table>'}
api('me').then(u=>{ME=u;go('Dashboard')}).catch(()=>{})
</script></body></html>
